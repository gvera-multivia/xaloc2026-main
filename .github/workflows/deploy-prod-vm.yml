name: Deploy Prod VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-prod-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on:
      - self-hosted
      - linux
      - xaloc-prod
    timeout-minutes: 150
    env:
      DEPLOY_REPO_PATH: /opt/xaloc/xaloc2026-main
      DEPLOY_ENV_FILE: /opt/xaloc/env/xaloc.env
      DEPLOY_COMPOSE_FILE: /opt/xaloc/xaloc2026-main/infra/docker/docker-compose.microservices.yml
      DEPLOY_TIMEOUT_SECONDS: "1800"
      DEPLOY_INTERVAL_SECONDS: "5"
    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Ensure persistent checkout exists
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d "${DEPLOY_REPO_PATH}/.git" ]; then
            echo "Persistent repo not found at ${DEPLOY_REPO_PATH}, cloning..."
            mkdir -p "$(dirname "${DEPLOY_REPO_PATH}")"
            git clone "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" "${DEPLOY_REPO_PATH}"
          fi
          git -C "${DEPLOY_REPO_PATH}" rev-parse --is-inside-work-tree

      - name: Verify runner and deploy environment
        shell: bash
        run: |
          set -euo pipefail
          python3 "${GITHUB_WORKSPACE}/scripts/deploy_precheck.py" \
            --repo-path "${DEPLOY_REPO_PATH}" \
            --env-file "${DEPLOY_ENV_FILE}" \
            --compose-file "${DEPLOY_COMPOSE_FILE}"

      - name: Pre-deploy quick checks
        shell: bash
        run: |
          set -euo pipefail
          git -C "${DEPLOY_REPO_PATH}" status --short --branch
          docker compose --env-file "${DEPLOY_ENV_FILE}" -f "${DEPLOY_COMPOSE_FILE}" ps || true

      - name: Sync persistent checkout to origin/main
        shell: bash
        run: |
          set -euo pipefail
          uid="$(id -u)"
          gid="$(id -g)"
          if sudo -n true >/dev/null 2>&1; then
            sudo chown -R "${uid}:${gid}" "${DEPLOY_REPO_PATH}" || true
          else
            echo "sudo sin permisos NOPASSWD; aplicando chown via contenedor auxiliar"
            docker run --rm -v "${DEPLOY_REPO_PATH}:/repo" alpine:3.20 sh -lc "chown -R ${uid}:${gid} /repo || true"
          fi
          git -C "${DEPLOY_REPO_PATH}" fetch --prune origin main
          git -C "${DEPLOY_REPO_PATH}" reset --hard origin/main
          git -C "${DEPLOY_REPO_PATH}" clean -fdx
          git -C "${DEPLOY_REPO_PATH}" rev-parse HEAD

      - name: Re-run deploy prechecks after sync
        shell: bash
        run: |
          set -euo pipefail
          python3 "${DEPLOY_REPO_PATH}/scripts/deploy_precheck.py" \
            --repo-path "${DEPLOY_REPO_PATH}" \
            --env-file "${DEPLOY_ENV_FILE}" \
            --compose-file "${DEPLOY_COMPOSE_FILE}"

      - name: Restart and rebuild stack
        shell: bash
        run: |
          set -euo pipefail
          cd "${DEPLOY_REPO_PATH}"
          python3 scripts/stack_control.py \
            --restart-rebuild \
            --env-file "${DEPLOY_ENV_FILE}" \
            --compose-file "${DEPLOY_COMPOSE_FILE}" \
            --timeout "${DEPLOY_TIMEOUT_SECONDS}" \
            --interval "${DEPLOY_INTERVAL_SECONDS}"

      - name: Post-deploy smoke checks
        shell: bash
        run: |
          set -euo pipefail
          docker compose --env-file "${DEPLOY_ENV_FILE}" -f "${DEPLOY_COMPOSE_FILE}" ps
          for i in $(seq 1 24); do
            if curl --fail --silent --show-error http://127.0.0.1/health > /dev/null; then
              break
            fi
            if [ "$i" -eq 24 ]; then
              echo "Gateway health check failed after retries"
              exit 1
            fi
            sleep 5
          done
          for i in $(seq 1 24); do
            if curl --fail --silent --show-error http://127.0.0.1/cartociudad/openapi.json > /dev/null; then
              break
            fi
            if [ "$i" -eq 24 ]; then
              echo "Cartociudad OpenAPI check failed after retries"
              exit 1
            fi
            sleep 5
          done

      - name: Collect diagnostics on failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          python3 "${GITHUB_WORKSPACE}/scripts/collect_deploy_diagnostics.py" \
            --repo-path "${DEPLOY_REPO_PATH}" \
            --env-file "${DEPLOY_ENV_FILE}" \
            --compose-file "${DEPLOY_COMPOSE_FILE}" \
            --output-dir "${GITHUB_WORKSPACE}/deploy-diagnostics"

      - name: Upload diagnostics artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-diagnostics-${{ github.run_id }}
          path: deploy-diagnostics
          if-no-files-found: error
