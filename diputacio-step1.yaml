        - heading "Manuales de ayuda para los trámites" [level=2] [ref=e316]
        - paragraph [ref=e317]:
          - text: Puede
          - link "consultar los manuales de ayuda" [ref=e318] [cursor=pointer]:
            - /url: /es/Home/manuals
          - text: si tiene dudas para acceder o realizar cualquier trámite de la Sede Electrónica del ORGT.
        - link "Volver arriba" [ref=e319] [cursor=pointer]:
          - /url: "#"
          - text: Volver arriba
          - img [ref=e320]
        - separator [ref=e321]
        - heading "El sistema da error o estoy en un punto del trámite y no sé como continuar (incidencias tecnológicas)" [level=2] [ref=e322]
        - paragraph [ref=e323]:
          - text: Compruebe los
          - link "requisitos técnicos" [ref=e324] [cursor=pointer]:
            - /url: ajuda?NouTramit=true#ancla23
          - text: para acceder a esta sede electrónica.
        - paragraph [ref=e325]:
          - text: Si quiere que le ayudemos por teléfono, rellene el formulario
          - link "Quiero que me llamen" [ref=e326] [cursor=pointer]:
            - /url: /es/TramitsPagaments/ATeleMail/atelemailP0?AtencioTelefonica=True&AtencioPerCorreu=False
          - text: Si lo prefiere, puede exponer el problema en el formulario
          - link "Quiero respuesta por correo electrónico" [ref=e327] [cursor=pointer]:
            - /url: /es/TramitsPagaments/ATeleMail/atelemailP0?AtencioTelefonica=False&AtencioPerCorreu=True
          - text: .
        - paragraph [ref=e328]:
          - text: "Nota: El personal que atiende estas peticiones no tiene acceso a sus datos personales y, por lo tanto no se responderán ni tramitarán consultas tributarias relativas a sus deudas, ya que se han de efectuar por"
          - link "registro electrónico." [ref=e329] [cursor=pointer]:
            - /url: ../Home/seltramit?apartat=1
        - link "Volver arriba" [ref=e330] [cursor=pointer]:
          - /url: "#"
          - text: Volver arriba
          - img [ref=e331]
        - separator [ref=e332]
        - heading "Intento pagar pero después de poner la tarjeta el sistema da error" [level=2] [ref=e333]
        - paragraph [ref=e334]:
          - text: En primer lugar compruebe que su documento está vigente y está en plazo de pago. En caso contrario, puede descargar un nuevo documento para pagar en
          - link "http://orgt.cat/pagos" [ref=e335] [cursor=pointer]:
            - /url: /es/TramitsPagaments/Pagar/Pagar
        - paragraph [ref=e336]: Si su tarjeta está vigente y no ha superado los límites de importes establecidos, reinicie su ordenador, o el teléfono móvil si está pagando desde el teléfono, y vuelva a intentar el pago en la web del ORGT.
        - paragraph [ref=e337]: "Si no lo consigue, le pedimos que intente efectuar el pago en la web del prestador del servicio de la Caixa del ORGT, con la misma tarjeta con la que está teniendo dificultades:"
        - paragraph [ref=e338]:
          - link "https://www.caixabank.es/particular/pagos/impuestosrecibosmatriculas_es.html" [ref=e339] [cursor=pointer]:
            - /url: https://www.caixabank.es/particular/pagos/impuestosrecibosmatriculas_es.html
        - paragraph [ref=e340]: Si tampoco puede pagar, probablemente tenga alguna explicación relacionada con las características de su tarjeta. Los límites de gasto o los factores de seguridad que piden las entidades bancarias y que han estado modificados recientemente por la normativa.
        - paragraph [ref=e341]:
          - text: Si lo desea, nos puede informar del resultado rellenando el
          - link "formulario de Ayuda" [ref=e342] [cursor=pointer]:
            - /url: /es/Home/ajudaform
          - text: indicando la referencia bancaria del pago pero nunca el número de la tarjeta bancaria.
        - link "Volver arriba" [ref=e343] [cursor=pointer]:
          - /url: "#"
          - text: Volver arriba
          - img [ref=e344]
        - separator [ref=e345]
        - heading "He hecho un pago pero el recibo no aparece en la lista de \"Tributos pagados\" y no puedo obtener un justificante de pago" [level=2] [ref=e346]
        - paragraph [ref=e347]: Los pagos efectuados en entidades colaboradoras (por ventanilla o banca online) pueden tardar hasta 48 horas en aparecer en la página de Tributos Pagados o Multas Pagadas. Los pagos hechos por la misma web del ORGT aparecerán pagados al día siguiente de efectuado el pago con tarjeta.
        - paragraph [ref=e348]: Una vez la deuda aparece como pagada, podrá obtener un justificante de pago.
        - paragraph [ref=e349]:
          - text: Si pasados estos plazos, su deuda aún figura pendiente, tiene que presentar un escrito de reclamación en
          - link "http://orgt.cat/registro" [ref=e350] [cursor=pointer]:
            - /url: /es/Home/seltramit
        - link "Volver arriba" [ref=e351] [cursor=pointer]:
          - /url: "#"
          - text: Volver arriba
          - img [ref=e352]
        - separator [ref=e353]
        - heading "¿Como puedo abrir ficheros PDF?" [level=2] [ref=e354]
        - paragraph [ref=e355]:
          - text: Si lo necesita puede
          - link "descargar gratuitamente programas" [ref=e356] [cursor=pointer]:
            - /url: ./descarregaprogrames
          - text: para leer documentos word y pdf
        - link "Volver arriba" [ref=e357] [cursor=pointer]:
          - /url: "#"
          - text: Volver arriba
          - img [ref=e358]
        - separator [ref=e359]
        - heading "Necesito reducir el tamaño de los documentos que quiero adjuntar en un trámite" [level=2] [ref=e360]
        - paragraph [ref=e361]: "Puede reducir el tamaño de un documento mediante alguna de las soluciones siguientes:"
        - list [ref=e362]:
          - listitem [ref=e363]: Si se trata de imágenes, abra el fichero desde cualquier editor y conviértalas a formato jpg con una resolución de 150 ppp.
          - listitem [ref=e364]: Si se trata de documentos que ha escaneado, haga el escaneo nuevamente en blanco y negro y no en color o escala de grises.
          - listitem [ref=e365]: No imprima documentos para escanearlos posteriormente. Es mejor convertirlos directamente a PDF, mediante la opción "Imprimir" de su editor de textos. En la versión 2010 de Word, esto también se puede hacer con la opción de "Guardar como".
        - link "Volver arriba" [ref=e366] [cursor=pointer]:
          - /url: "#"
          - text: Volver arriba
          - img [ref=e367]
        - separator [ref=e368]
        - heading "Quiero entrar en la web del ORGT personalizada con la información de mi municipio" [level=2] [ref=e369]
        - paragraph [ref=e370]:
          - text: Muchos contribuyentes tributan por más de un municipio, pero si desea guardar un enlace directo personalizado con el nombre del municipio donde tributa puede hacerlo añadiendo "?cdclie=nnn" a la dirección principal, donde nnn es el código de tres números de su municipio según
          - link "codificación de la AEAT" [ref=e371] [cursor=pointer]:
            - /url: ./ObrirPDF?NomFitxer=Llistat ajuntaments.pdf
          - text: . Por ejemplo, para Abrera la versión en castellano sería
          - link "https://orgt.diba.cat/es?cdclie=001" [ref=e372] [cursor=pointer]:
            - /url: /Home?cdclie=001
        - link "Volver arriba" [ref=e373] [cursor=pointer]:
          - /url: "#"
          - text: Volver arriba
          - img [ref=e374]
        - separator [ref=e375]
        - heading "Necesito hacer un trámite o consulta por teléfono y el interesado es persona jurídica" [level=2] [ref=e376]
        - paragraph [ref=e377]:
          - text: La Ley 39/2015, de 1 de octubre, del procedimiento administrativo común de las administraciones públicas, establece el uso obligatorio de los medios electrónicos para todas las personas jurídicas en sus relaciones con la Administración. En esta sede encontrará todos
          - link "los trámites" [ref=e378] [cursor=pointer]:
            - /url: ../TramitsPagaments/Home/tramits
          - text: que puede efectuar electrónicamente y podrá consultar mucha información sobre sus obligaciones tributarias con los ayuntamientos.
        - paragraph [ref=e379]:
          - text: Si necesita ayuda para hacer un trámite en la web, consulte la pregunta sobre
          - link "incidencias tecnológicas" [ref=e380] [cursor=pointer]:
            - /url: /es/Home/Ajuda?NouTramit=True#ancla9
        - link "Volver arriba" [ref=e381] [cursor=pointer]:
          - /url: "#"
          - text: Volver arriba
          - img [ref=e382]
        - separator [ref=e383]
        - heading "Soy persona física y quiero hacer un trámite o consulta por teléfono (información tributaria)" [level=2] [ref=e384]
        - paragraph [ref=e385]:
          - text: El ORGT ha diseñado todos
          - link "los trámites" [ref=e386] [cursor=pointer]:
            - /url: ../TramitsPagaments/Home/tramits
          - text: para que le sean cómodos y rápidos de utilizar. Aun así, puede resolver algunos trámites por teléfono llamando al número 93 202 98 02 de lunes a viernes de 8:00 a 14:00 (lunes y miercoles de 15:00 a 17:00).
        - paragraph [ref=e387]:
          - text: Si necesita ayuda para hacer un trámite en la web, consulte la pregunta sobre
          - link "incidencias tecnológicas" [ref=e388] [cursor=pointer]:
            - /url: /es/Home/Ajuda?NouTramit=True#ancla9
        - paragraph
        - link "Volver arriba" [ref=e389] [cursor=pointer]:
          - /url: "#"
          - text: Volver arriba
          - img [ref=e390]
        - separator [ref=e391]
        - heading "Necesito atención presencial en alguna de las oficinas del ORGT" [level=2] [ref=e392]
        - paragraph [ref=e393]:
          - text: Si necesita una atención presencial en alguna de las oficinas del ORGT, puede
          - link "pedir cita previa" [ref=e394] [cursor=pointer]:
            - /url: ../TramitsPagaments/CitaPrevia/citapreviaDades
          - text: y así no tendrá que hacer cola. Cuando pida la cita previa, verá la lista de las oficinas donde podrá resolver su trámite en función del tema concreto a tratar. El sistema también verificará si puede hacer su gestión en la oficina del ORGT o, por el contrario, debe dirigirse al Ayuntamiento porque se trata de un procedimiento que no ha sido delegado en la Diputación de Barcelona.
        - link "Volver arriba" [ref=e395] [cursor=pointer]:
          - /url: "#"
          - text: Volver arriba
          - img [ref=e396]
        - separator [ref=e397]
        - heading "Quiero presentar una queja o sugerencia" [level=2] [ref=e398]
        - paragraph [ref=e399]:
          - text: Estas
          - link "respuestas de ayuda" [ref=e400] [cursor=pointer]:
            - /url: "#"
          - text: le pueden ser útiles antes de redactar su queja o sugerencia. Para presentarla necesitará un identificador digital. Si dispone de tarjeta sanitaria individual del CatSalut, puede
          - link "obtener al momento un identificador idCAT Mòbil" [ref=e401] [cursor=pointer]:
            - /url: https://idcatmobil.seu.cat/?language=es
          - text: .
        - link "Volver arriba" [ref=e402] [cursor=pointer]:
