        - heading "¿Como puedo actuar en representación de otro interesado?" [level=2] [ref=e99]
        - paragraph [ref=e100]:
          - text: Si ha de actuar en representación de otro interesado o por autorización, primero se ha de identificar con su identificador o certificado digital (personal o de representante). Después el sistema le preguntará los datos del interesado y deberá adjuntar el documento que acredite la representación o autorización para el trámite. El
          - link "documento de autorización" [ref=e101] [cursor=pointer]:
            - /url: ./DescarregarPDF?NomFitxer=Imprès autorització (ESP).pdf
          - text: se puede firmar digitalmente o bien en papel y escanearlo.
        - link "Volver arriba" [ref=e102] [cursor=pointer]:
          - /url: "#"
          - text: Volver arriba
          - img [ref=e103]
        - separator [ref=e104]
        - heading "No consigo identificarme con mi certificado digital (DNI electrónico u otros identificadores) y no acabo el proceso de autenticación" [level=2] [ref=e105]
        - paragraph [ref=e106]:
          - text: Consulte
          - link "la ayuda del soporte de usuarios de la AOC." [ref=e107] [cursor=pointer]:
            - /url: https://www.aoc.cat/knowledge-base/sistemes-didentificacio-digital
          - text: Compruebe que su certificado funciona correctamente en
          - link "la página de validación de la AOC." [ref=e108] [cursor=pointer]:
            - /url: http://signasuite.aoc.cat/signasuite/validateCertificate
          - text: Si el certificado funciona pero no consigue autenticarse, puede abrir una
          - link "petición de ayuda en la AOC." [ref=e109] [cursor=pointer]:
            - /url: https://www.aoc.cat/portal-suport/necessiteu-mes-ajuda
          - text: En caso de persona física también puede obtener al momento un identificador IdCAT móvil gracias a su certificado digital en
          - link "https://idcatmobil.seu.cat/" [ref=e110] [cursor=pointer]:
            - /url: https://idcatmobil.seu.cat/
          - text: (Alta con certificado digital). Entonces identifíquese con su nuevo IdCAT móvil.
        - link "Volver arriba" [ref=e111] [cursor=pointer]:
          - /url: "#"
          - text: Volver arriba
          - img [ref=e112]
        - separator [ref=e113]
        - heading "He accedido al espacio de notificaciones electrónicas pero no encuentro la notificación que me ha enviado el ORGT" [level=2] [ref=e114]
        - paragraph [ref=e115]:
          - text: Es posible que haya accedido a Enotum desde un enlace genérico de Google. Debe hacerlo con los enlaces que tiene en el correo de aviso o a través de la dirección
          - link "http://orgt.cat/notificaciones" [ref=e116] [cursor=pointer]:
            - /url: /TramitsPagaments/EnotifAlertes/alertesenotif
          - text: que le llevará directamente al espacio de notificaciones del ORGT.
        - paragraph [ref=e117]: "Si aun así no encuentra la notificación, hay diversas situaciones que ha de considerar:"
        - paragraph [ref=e118]: Primero compruebe si en la parte superior de la pantalla aparece el mensaje “Tiene entradas sin abrir en otros organismos” y en este caso pulse el enlace y compruebe si se trata de notificaciones del ORGT.
        - paragraph [ref=e119]: En segundo lugar, si ha entrado con un certificado digital de representante, localice en la parte superior los botones correspondientes a Particular y Empresa para poder buscar la notificación en las dos carpetas.
        - paragraph [ref=e120]:
          - text: En tercer lugar, si ha designado un representante para recibir sus comunicaciones electrónicas, tenga en cuenta que sólo se enviarán a su espacio de notificaciones. Dé de baja esta designación si desea acceder a futuras notificaciones con certificado digital de la persona jurídica o si éste representa también a otras personas, porque recibirá en su espacio de notificaciones las de todos sus representados sin distinción. Puede hacerlo en
          - link "http://orgt.cat/notificaciones" [ref=e121] [cursor=pointer]:
            - /url: /TramitsPagaments/EnotifAlertes/alertesenotif
          - text: .
        - paragraph [ref=e122]: Finalmente asegúrese de que en “Sistema de acceso” (menú de la izquierda) tiene marcado “Contraseña” aunque haya entrado con certificado digital. Si tiene marcado “Solo con certificado digital” puede ser que no se muestren todas sus notificaciones electrónicas.
        - text: El Consorcio AOC ofrece esta
        - link "ayuda sobre el portal Enotum" [ref=e123] [cursor=pointer]:
          - /url: https://suport.aoc.cat/hc/es-es
        - text: para la recogida de notificaciones y comunicaciones electrónicas.
        - link "Volver arriba" [ref=e124] [cursor=pointer]:
          - /url: "#"
          - text: Volver arriba
          - img [ref=e125]
        - separator [ref=e126]
        - heading "El sistema no me deja acceder a las notificaciones con contraseña de un solo uso" [level=2] [ref=e127]
        - paragraph [ref=e128]: Compruebe si hay un símbolo de candado, lo que significa que debe acceder con certificado digital.
        - paragraph [ref=e129]: Cuando una persona jurídica no ha comunicado medios de aviso al ORGT, verá todas sus notificaciones con este símbolo y solo podrá acceder con certificado digital. Puede comunicar los medios de aviso en la dirección http://orgt.cat/notificaciones
        - link "Volver arriba" [ref=e130] [cursor=pointer]:
          - /url: "#"
          - text: Volver arriba
          - img [ref=e131]
        - separator [ref=e132]
        - heading "Intento acceder con Clave Pin o Clave Permanente y aparece un error" [level=2] [ref=e133]
        - paragraph [ref=e134]: "Si el mensaje indica que se requiere un registro presencial o certificado electrónico significa que obtuvo su identificador Clave de forma no presencial y no tiene el nivel requerido por los trámites del ORGT. Para aumentar el nivel tiene dos opciones:"
        - list [ref=e135]:
          - listitem [ref=e136]:
            - text: Pedir cita en una oficina del Servicio Clave. La lista de oficinas se puede consultar en el buscador marcando la tipología "Clave" en el portal
            - link "http://administracion.gob.es" [ref=e137] [cursor=pointer]:
              - /url: http://administracion.gob.es
          - listitem [ref=e138]:
            - text: Hacer el trámite por Internet, si dispone de certificado digital, en la dirección
            - link "http://clave.gob.es/clave_Home/registro/Modificacion-datos.html" [ref=e139] [cursor=pointer]:
              - /url: http://clave.gob.es/clave_Home/registro/Modificacion-datos.html
            - text: (Deberá escoger la opción de "Modificación de datos" y luego marcar "Obtener un nivel superior de seguridad en Cl@ve Asociado al registro presencial o telemático con certificado electrónico")
        - paragraph
        - link "Volver arriba" [ref=e140] [cursor=pointer]:
          - /url: "#"
          - text: Volver arriba
          - img [ref=e141]
        - separator [ref=e142]
        - heading "Intento acceder a la notificación y el sistema dice que no pertenece al destinatario" [level=2] [ref=e143]
        - paragraph [ref=e144]:
          - text: Si ha recibido el aviso de la notificación por correo electrónico, compruebe si le ha llegado redirigida de otra dirección de correo electrónico en la que tiene activada una redirección. Le recomendamos que acceda con certificado digital. Si quiere entrar con palabra de paso de un solo uso, indique el correo electrónico que dio de alta para la recepción de los avisos. El Consorcio AOC ofrece esta
          - link "ayuda sobre el portal Enotum" [ref=e145] [cursor=pointer]:
            - /url: https://www.aoc.cat/portal-suport/enotum-ciutadania/idservei/enotum_ciutadania/
          - text: para la recogida de notificaciones y comunicaciones electrónicas.
        - link "Volver arriba" [ref=e146] [cursor=pointer]:
          - /url: "#"
          - text: Volver arriba
          - img [ref=e147]
        - separator [ref=e148]
        - heading "¿Por qué motivo recibo los avisos de notificaciones electrónicas de multas en dos correos electrónicos diferentes?" [level=2] [ref=e149]
        - paragraph [ref=e150]: Esto pasa cuando ha comunicado medios de aviso al ORGT para las notificaciones del procedimiento tributario y también está apuntado a la DEV para las notificaciones del procedimiento sancionador de multas, pero los medios de aviso son diferentes. Hay personas jurídicas que les interesa comunicar medios diferentes ya que tienen departamentos específicos para gestionar cada tema, pero si este no es su caso, le recomendamos que comunique los mismos medios tanto en la DGT (Dirección General de Tráfico) como en el ORGT.
        - link "Volver arriba" [ref=e151] [cursor=pointer]:
          - /url: "#"
          - text: Volver arriba
          - img [ref=e152]
        - separator [ref=e153]
        - heading "Quiero recibir los avisos de notificaciones electrónicas en más de un correo electrónico" [level=2] [ref=e154]
        - paragraph [ref=e155]: Pregunte a su proveedor de correo electrónico cual es el mejor sistema en su caso. En general se opta por crear una lista de distribución que incluya las diferentes direcciones de correo donde quiere recibir los avisos.
        - link "Volver arriba" [ref=e156] [cursor=pointer]:
          - /url: "#"
          - text: Volver arriba
          - img [ref=e157]
        - separator [ref=e158]
        - heading "Requisitos técnicos de acceso" [level=2] [ref=e159]
        - paragraph [ref=e160]: La sede electrónica del ORGT es una web responsive que puede ser accedida desde cualquier dispositivo, sistema operativo y navegador que soporte las tecnologías y estándares HTML5, CSS3 y ECMAScript 6 (Javascript ES6). Esto incluye tanto dispositivos móviles como de escritorio; sistemas operativos como Windows, Mac y Linux; y navegadores como Microsoft Edge, Mozilla Firefox, Safari y Google Chrome, entre otros. Se recomienda siempre actualizar a las últimas versiones que suministran los fabricantes.
        - paragraph [ref=e161]: No se recomienda en absoluto el uso de Internet Explorer para acceder y navegar por la sede electrónica del ORGT. El navegador Internet Explorer fue descatalogado por Microsoft y quedó oficialmente sustituido por Microsoft Edge. Como está obsoleto, Internet Explorer ya no recibe actualizaciones, soporte, ni mantenimiento. Además, no soporta el estándar ES6 de Javascript, hecho que puede provocar errores o carencias de funcionalidades modernas en determinadas páginas, llegando incluso a imposibilitar la finalización de un trámite o la correcta visualización de una página.
        - paragraph [ref=e162]: El acceso a la sede puede estar bloqueado para conexiones procedentes de determinados países o regiones, por motivos de seguridad.
        - link "Volver arriba" [ref=e163] [cursor=pointer]:
          - /url: "#"
          - text: Volver arriba
          - img [ref=e164]
