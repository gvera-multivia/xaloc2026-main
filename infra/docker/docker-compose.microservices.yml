services:
  postgres:
    image: postgres:16-alpine
    container_name: xaloc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: xaloc
      POSTGRES_USER: xaloc
      POSTGRES_PASSWORD: xaloc_dev_password
      TZ: Europe/Madrid
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xaloc -d xaloc"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: xaloc-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  jobs-service:
    image: python:3.11-slim
    container_name: xaloc-jobs-service
    restart: unless-stopped
    working_dir: /app
    command: >
      sh -c "apt-get update &&
             apt-get install -y --no-install-recommends unixodbc unixodbc-dev freetds-bin tdsodbc gcc g++ &&
             rm -rf /var/lib/apt/lists/* &&
             pip install --no-cache-dir -r requirements.txt &&
             uvicorn services.jobs.app:app --host 0.0.0.0 --port 8103"
    environment:
      USE_PG_SOURCE_OF_TRUTH: "1"
      QUEUE_MODE: redis_streams
      REPORT_PG_DSN: postgresql://xaloc:xaloc_dev_password@postgres:5432/xaloc
    volumes:
      - ../../:/app
    ports:
      - "8103:8103"
    depends_on:
      postgres:
        condition: service_healthy

  auth-rbac-service:
    image: python:3.11-slim
    container_name: xaloc-auth-rbac
    restart: unless-stopped
    working_dir: /app
    command: >
      sh -c "pip install --no-cache-dir fastapi uvicorn pyjwt psycopg[binary] &&
             uvicorn services.auth_rbac.app:app --host 0.0.0.0 --port 8101"
    environment:
      DASHBOARD_JWT_ISSUER: xaloc-dashboard
      DASHBOARD_JWT_AUDIENCE: xaloc-dashboard-clients
      DASHBOARD_TOKEN_EXPIRE_MINUTES: "480"
      DASHBOARD_ADMIN_USERNAME: ${DASHBOARD_ADMIN_USERNAME:-admin}
      DASHBOARD_ADMIN_PASSWORD: ${DASHBOARD_ADMIN_PASSWORD:-admin1234}
      USE_PG_SOURCE_OF_TRUTH: ${USE_PG_SOURCE_OF_TRUTH:-1}
      REPORT_PG_DSN: ${REPORT_PG_DSN:-postgresql://xaloc:xaloc_dev_password@postgres:5432/xaloc}
    volumes:
      - ../../:/app
    ports:
      - "8101:8101"

  dashboard-backend-service:
    image: python:3.11-slim
    container_name: xaloc-dashboard-backend
    restart: unless-stopped
    working_dir: /app
    command: >
      sh -c "apt-get update &&
             apt-get install -y --no-install-recommends unixodbc unixodbc-dev freetds-bin tdsodbc gcc g++ &&
             rm -rf /var/lib/apt/lists/* &&
             pip install --no-cache-dir -r requirements.txt &&
             uvicorn services.dashboard_backend.app:app --host 0.0.0.0 --port 8788"
    environment:
      DASHBOARD_ENABLE_FRONTEND_PROXY: "0"
      AUTH_RBAC_SERVICE_URL: http://auth-rbac-service:8101
      USE_PG_SOURCE_OF_TRUTH: "1"
      QUEUE_MODE: redis_streams
      DASHBOARD_HISTORY_SOURCE: ${DASHBOARD_HISTORY_SOURCE:-pg}
      REPORT_PG_DSN: ${REPORT_PG_DSN:-postgresql://xaloc:xaloc_dev_password@postgres:5432/xaloc}
      SQLITE_WRITES_ENABLED: "0"
      CLIENT_DOCS_BASE_PATH: /mnt/clientes
    volumes:
      - ../../:/app
      - clientes_smb:/mnt/clientes:rw
    ports:
      - "8788:8788"
    depends_on:
      auth-rbac-service:
        condition: service_started

  api-gateway:
    image: python:3.11-slim
    container_name: xaloc-api-gateway
    restart: unless-stopped
    working_dir: /app
    command: >
      sh -c "apt-get update &&
             apt-get install -y --no-install-recommends nodejs npm unixodbc unixodbc-dev freetds-bin tdsodbc gcc g++ &&
             rm -rf /var/lib/apt/lists/* &&
             pip install --no-cache-dir -r requirements.txt &&
             cd /app/dashboard-frontend &&
             npm install --include=dev --include=optional &&
             if [ ! -f /app/dashboard-frontend/node_modules/lightningcss-linux-x64-gnu/lightningcss.linux-x64-gnu.node ]; then
               echo '[api-gateway] reparando lightningcss nativo para linux' &&
               npm rebuild lightningcss --include=optional &&
               npm install lightningcss-linux-x64-gnu@1.30.2 --no-save;
             fi &&
             cd /app &&
             uvicorn services.api_gateway.app:app --host 0.0.0.0 --port 8080"
    environment:
      DASHBOARD_BACKEND_URL: http://dashboard-backend-service:8788
      DASHBOARD_FRONTEND_HOST: 0.0.0.0
      DASHBOARD_FRONTEND_PORT: "3000"
      DASHBOARD_FRONTEND_DEV: ${DASHBOARD_FRONTEND_DEV:-0}
    volumes:
      - ../../:/app
      - dashboard_frontend_node_modules:/app/dashboard-frontend/node_modules
      - dashboard_frontend_next:/app/dashboard-frontend/.next
    ports:
      - "8080:8080"
    depends_on:
      dashboard-backend-service:
        condition: service_started

  brain-claim-service:
    image: python:3.11-slim
    container_name: xaloc-brain-claim
    restart: unless-stopped
    working_dir: /app
    command: >
      sh -c "apt-get update &&
             apt-get install -y --no-install-recommends unixodbc unixodbc-dev freetds-bin tdsodbc gcc g++ &&
             rm -rf /var/lib/apt/lists/* &&
             pip install --no-cache-dir -r requirements.txt &&
             python -m services.brain_claim.app"
    environment:
      USE_PG_SOURCE_OF_TRUTH: "1"
      SQLITE_WRITES_ENABLED: "0"
      REDIS_ENABLED: "1"
      REDIS_URL: redis://redis:6379/0
      CANDIDATES_STREAM_KEY: candidates
      REPORT_PG_DSN: postgresql://xaloc:xaloc_dev_password@postgres:5432/xaloc
      QUEUE_MODE: redis_streams
      CLIENT_DOCS_BASE_PATH: /mnt/clientes
    volumes:
      - ../../:/app
      - clientes_smb:/mnt/clientes:rw
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  payload-validator-service:
    image: python:3.11-slim
    container_name: xaloc-payload-validator
    restart: unless-stopped
    working_dir: /app
    command: >
      sh -c "apt-get update &&
             apt-get install -y --no-install-recommends unixodbc unixodbc-dev freetds-bin tdsodbc gcc g++ &&
             rm -rf /var/lib/apt/lists/* &&
             pip install --no-cache-dir -r requirements.txt &&
             python -m services.payload_validator.app"
    environment:
      USE_PG_SOURCE_OF_TRUTH: "1"
      SQLITE_WRITES_ENABLED: "0"
      REDIS_ENABLED: "1"
      REDIS_URL: redis://redis:6379/0
      CANDIDATES_STREAM_KEY: candidates
      VALIDATED_STREAM_KEY: validated
      VALIDATOR_STREAM_GROUP: validator_group
      REPORT_PG_DSN: postgresql://xaloc:xaloc_dev_password@postgres:5432/xaloc
    volumes:
      - ../../:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  batcher-dispatcher-service:
    image: python:3.11-slim
    container_name: xaloc-batcher-dispatcher
    restart: unless-stopped
    working_dir: /app
    command: >
      sh -c "apt-get update &&
             apt-get install -y --no-install-recommends unixodbc unixodbc-dev freetds-bin tdsodbc gcc g++ &&
             rm -rf /var/lib/apt/lists/* &&
             pip install --no-cache-dir -r requirements.txt &&
             python -m services.batcher_dispatcher.app"
    environment:
      USE_PG_SOURCE_OF_TRUTH: "1"
      SQLITE_WRITES_ENABLED: "0"
      REDIS_ENABLED: "1"
      REDIS_URL: redis://redis:6379/0
      VALIDATED_STREAM_KEY: validated
      QUEUE_STREAM_JOBS_KEY: jobs
      DLQ_VALIDATED_STREAM_KEY: dlq:validated
      BATCH_WINDOW_SECONDS: "30"
      BATCHER_STREAM_GROUP: batcher_group
      REPORT_PG_DSN: postgresql://xaloc:xaloc_dev_password@postgres:5432/xaloc
    volumes:
      - ../../:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-orchestrator-service:
    image: python:3.11-slim
    container_name: xaloc-worker-orchestrator
    restart: unless-stopped
    working_dir: /app
    command: >
      sh -c "apt-get update &&
             apt-get install -y --no-install-recommends unixodbc unixodbc-dev freetds-bin tdsodbc gcc g++ &&
             rm -rf /var/lib/apt/lists/* &&
             pip install --no-cache-dir -r requirements.txt &&
             python -m services.worker_orchestrator.app"
    environment:
      USE_PG_SOURCE_OF_TRUTH: "1"
      SQLITE_WRITES_ENABLED: "0"
      REDIS_ENABLED: "1"
      REDIS_URL: redis://redis:6379/0
      QUEUE_MODE: redis_streams
      USE_PLAYWRIGHT_RUNNER_SERVICE: "1"
      PLAYWRIGHT_RUNNER_URL: http://playwright-runner-service:8111
      QUEUE_STREAM_JOBS_KEY: jobs
      QUEUE_STREAM_GROUP: worker_group
      QUEUE_STREAM_DLQ_KEY: dlq:jobs
      REPORT_PG_DSN: postgresql://xaloc:xaloc_dev_password@postgres:5432/xaloc
      CLIENT_DOCS_BASE_PATH: /mnt/clientes
    volumes:
      - ../../:/app
      - artifacts_data:/data/artifacts
      - clientes_smb:/mnt/clientes:rw
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      playwright-runner-service:
        condition: service_started

  playwright-runner-service:
    image: mcr.microsoft.com/playwright/python:v1.52.0-jammy
    container_name: xaloc-playwright-runner
    restart: unless-stopped
    working_dir: /app
    command: >
      sh -c "apt-get update &&
             apt-get install -y --no-install-recommends unixodbc unixodbc-dev freetds-bin tdsodbc gcc g++ &&
             rm -rf /var/lib/apt/lists/* &&
             pip install --no-cache-dir -r requirements.txt fastapi uvicorn &&
             uvicorn services.playwright_runner.app:app --host 0.0.0.0 --port 8111"
    environment:
      XALOC_HEADLESS: "1"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ../../:/app
      - artifacts_data:/data/artifacts
    ports:
      - "8111:8111"

  signing-service:
    image: python:3.11-slim
    container_name: xaloc-signing-service
    restart: unless-stopped
    working_dir: /app
    command: >
      sh -c "pip install --no-cache-dir fastapi uvicorn &&
             uvicorn services.signing.app:app --host 0.0.0.0 --port 8112"
    environment:
      SIGNING_CERT_PATH: /data/certificates/certificate.pfx
      PYTHONUNBUFFERED: "1"
    volumes:
      - ../../:/app
      - ../../certificates:/data/certificates:ro
    ports:
      - "8112:8112"

volumes:
  postgres_data:
  redis_data:
  artifacts_data:
  dashboard_frontend_node_modules:
  dashboard_frontend_next:
  clientes_smb:
    driver: local
    driver_opts:
      type: cifs
      o: username=${SMB_USER},password=${SMB_PASS},vers=${SMB_VERS:-3.0},rw,iocharset=utf8
      device: "//${SMB_SERVER}/${SMB_SHARE}"
