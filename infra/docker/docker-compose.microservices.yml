    environment:
      SQLSERVER_CONNECTION_STRING: ${SQLSERVER_CONNECTION_STRING:-}
      SQLSERVER_DRIVER: ${SQLSERVER_DRIVER:-}
      SQLSERVER_SERVER: ${SQLSERVER_SERVER:-}
      SQLSERVER_PORT: ${SQLSERVER_PORT:-1433}
      SQLSERVER_TDS_VERSION: ${SQLSERVER_TDS_VERSION:-7.4}
      SQLSERVER_LOGIN_TIMEOUT: ${SQLSERVER_LOGIN_TIMEOUT:-10}
      SQLSERVER_DATABASE: ${SQLSERVER_DATABASE:-}
      SQLSERVER_USERNAME: ${SQLSERVER_USERNAME:-}
      SQLSERVER_PASSWORD: ${SQLSERVER_PASSWORD:-}
      SQLSERVER_TRUSTED_CONNECTION: ${SQLSERVER_TRUSTED_CONNECTION:-0}
      SIGNING_CERT_PATH: /data/certificates/certificate.pfx
      PYTHONUNBUFFERED: "1"
    volumes:
      - ../../:/app
      - ${CERTIFICATES_HOST_PATH:-../../certificates}:/data/certificates:ro
    ports:
      - "127.0.0.1:8112:8112"
    labels:
      autoheal: "true"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://127.0.0.1:8112/docs', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  autoheal:
    image: willfarrell/autoheal:latest
    container_name: xaloc-autoheal
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 30
      AUTOHEAL_START_PERIOD: 120
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      playwright-runner-service:
        condition: service_started

  minio:
    image: minio/minio:latest
    container_name: xaloc-minio
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  xaloc-proxy:
    image: caddy:alpine
    container_name: xaloc-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      api-gateway:
        condition: service_started
      playwright-runner-service:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
  artifacts_data:
  dashboard_frontend_node_modules:
  dashboard_frontend_next:
  clientes_smb:
