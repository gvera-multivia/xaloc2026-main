services:
  postgres:
    image: postgres:16-alpine
    container_name: xaloc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: xaloc
      POSTGRES_USER: xaloc
      POSTGRES_PASSWORD: xaloc_dev_password
      TZ: Europe/Madrid
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xaloc -d xaloc"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: xaloc-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  jobs-service:
    image: python:3.11-slim
    container_name: xaloc-jobs-service
    restart: unless-stopped
    working_dir: /app
    command: >
      sh -c "pip install --no-cache-dir fastapi uvicorn psycopg[binary] &&
             uvicorn services.jobs.app:app --host 0.0.0.0 --port 8103"
    environment:
      REPORT_PG_DSN: postgresql://xaloc:xaloc_dev_password@postgres:5432/xaloc
    volumes:
      - ../../:/app
    ports:
      - "8103:8103"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
