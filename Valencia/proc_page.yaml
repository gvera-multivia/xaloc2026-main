            - generic [ref=e138] [cursor=pointer]: Descripció
            - paragraph [ref=e140]: Fer constar per escrit disconformitat contra les denúncies formulades per infraccions de trànsit.
          - generic [ref=e141]:
            - generic [ref=e142] [cursor=pointer]: Qui ho pot sol·licitar?
            - paragraph [ref=e144]: La persona denunciada, el conductor habitual i arrendatari a llarg termini designats davant de la DGT o el conductor del vehicle, identificant-se com a tal, en el cas que la denúncia haja sigut formulada al titular del vehicle, conductor habitual o arrendatari a llarg termini designats davant de la DGT, i este no coincidisca amb el conductor en el moment de la infracció.
          - generic [ref=e145]:
            - generic [ref=e146] [cursor=pointer]: Quan sol·licitar-ho
            - paragraph [ref=e148]:
              - text: En el termini de
              - strong [ref=e149]: vint dies naturals
              - text: a partir del següent al de notificació de la denúncia.
          - generic [ref=e150]:
            - generic [ref=e151] [cursor=pointer]: Documentació a presentar
            - generic [ref=e152]:
              - paragraph
              - paragraph [ref=e153]:
                - strong [ref=e154]: Instància de sol·licitud
                - text: "que haurà de contindre:"
              - list:
                - listitem [ref=e155]: Nom, cognoms i, si és el cas, nom cognoms i DNI /NIE o documents identificatius de la persona que el represente, així com el domicili que s'assenyale a efectes de notificacions.
                - listitem [ref=e156]: Número de permís o llicència de conducció de l'interessat.
                - listitem [ref=e157]: Fets, raons i petició en què es concrete, amb tota claredat, la sol·licitud, així com la referència de la denúncia que motiva les al·legacions (dades que consten en la notificació apartat Cite's en cas d'al·legació, MU ... o si és el cas número del butlletí de denúncia) i la matrícula del vehicle.
                - listitem [ref=e158]: Lloc, data i firma del sol·licitant.
              - paragraph [ref=e159]: "I acompanyada de:"
              - list:
                - listitem [ref=e160]: Còpia de la denúncia o notificació que motiva la reclamació.
                - listitem [ref=e161]: Documents justificatius que acrediten allò que s'ha al·legat per la persona interessada en el seu escrit.
              - paragraph
              - text: "Documentació addicional necessària segons el cas:"
              - list:
                - listitem [ref=e162]:
                  - text: "Escrit d’al·legacions contra denúncia per infracció de trànsit:"
                  - list:
