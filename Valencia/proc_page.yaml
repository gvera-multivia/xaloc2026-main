          - generic [ref=e165]:
            - generic [ref=e166] [cursor=pointer]: Informació Complementària
            - paragraph [ref=e168]:
              - text: "La denúncia i acord d'incoació contra el qual s'interposa el present escrit d'al·legacions, inicia:"
              - text: "- El termini de caducitat d'una any a comptar des de l'adopció de l'acord d'incoació, que suposarà l'arxivament de les actuacions, si no s'haguera dictat resolució sancionadora."
              - text: "- La prescripció de la infracció en un termini de 3 o 6 mesos -segons es tracte d'una infracció lleu (3 mesos) o greu/molt greu (6 mesos) a comptar a partir del dia en què els fets s'hagueren comés."
          - generic [ref=e169]:
