<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mock - Página Documentos ORGT</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; }
    .form-group { margin: 15px 0; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input[type="text"] { width: 100%; padding: 8px; border: 1px solid #ccc; font-size: 14px; box-sizing: border-box; }
    .btn { padding: 8px 16px; background: #337ab7; color: white; border: none; cursor: pointer; font-size: 14px; }
    .btn-success { background: #5cb85c; }
    #status { margin-top: 20px; padding: 10px; background: #f0f0f0; border: 1px solid #ccc; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    td, th { border: 1px solid #ccc; padding: 6px 10px; }
    .error { color: red; font-size: 12px; }

    /* ====== fakeBrowse: DIV ESTILIZADO que dispara input file OCULTO ====== */
    /* Esta es la variante más común en portales ASP.NET/ORGT */
    #fakeBrowse {
      display: inline-block;
      padding: 6px 12px;
      background: #337ab7;
      color: white;
      cursor: pointer;
      border-radius: 4px;
      font-size: 14px;
      user-select: none;
    }
    /* El input real está OCULTO con display:none */
    #realFileInput {
      display: none;
    }
  </style>
</head>
<body>
  <h2>Adjuntar documentació</h2>
  <p>Replicació de la pantalla de documents ORGT (<code>#ComentFile</code> + <code>#fakeBrowse</code>)</p>

  <form id="docsForm">
    <div class="form-group">
      <label for="ComentFile">Descripció del document:</label>
      <!-- Campo ComentFile — mismo ID que el sitio real -->
      <input type="text" id="ComentFile" name="ComentFile" maxlength="100" placeholder="Descripció obligatòria">
      <span class="error" id="errorComent" style="display:none">El camp és obligatori</span>
    </div>

    <div class="form-group">
      <label>Document:</label>
      <!-- fakeBrowse: div que hace click en input file oculto via JS -->
      <div id="fakeBrowse">Navega...</div>
      <!-- Input file OCULTO con display:none -->
      <input type="file" id="realFileInput" name="fitxer" accept=".pdf,.doc,.docx,.xls,.xlsx">
      <span id="uploadedFileName" style="margin-left:10px; color:#555;"></span>
    </div>

    <!-- Tabla de documentos adjuntos (se rellena tras upload) -->
    <div id="uploadedTableContainer" style="display:none">
      <table id="uploadedTable">
        <thead><tr><th>Nom fitxer</th><th>Mida</th><th>Acció</th></tr></thead>
        <tbody id="uploadedTableBody"></tbody>
      </table>
    </div>

    <div class="form-group" style="margin-top:20px">
      <input type="submit" value="Continuar" id="btnContinuar">
    </div>
  </form>

  <div id="status">
    <strong>Estado:</strong>
    <div id="statusText">Sin interacción</div>
  </div>

  <script>
    const fakeBrowse = document.getElementById('fakeBrowse');
    const realFileInput = document.getElementById('realFileInput');
    const uploadedFileName = document.getElementById('uploadedFileName');
    const statusText = document.getElementById('statusText');

    // fakeBrowse dispara el input file oculto cuando se hace click
    fakeBrowse.addEventListener('click', function() {
      realFileInput.click();
    });

    realFileInput.addEventListener('change', function() {
      if (this.files.length > 0) {
        const f = this.files[0];
        uploadedFileName.textContent = f.name;

        // Añadir fila a la tabla
        const tbody = document.getElementById('uploadedTableBody');
        const tr = document.createElement('tr');
        tr.innerHTML = '<td>' + f.name + '</td><td>' + Math.round(f.size/1024) + ' KB</td><td><a href="#">Eliminar</a></td>';
        tbody.innerHTML = '';
        tbody.appendChild(tr);
        document.getElementById('uploadedTableContainer').style.display = 'block';
        statusText.textContent = 'Archivo cargado: ' + f.name;
      }
    });

    document.getElementById('docsForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const coment = document.getElementById('ComentFile').value.trim();
      const hasFile = realFileInput.files.length > 0 || uploadedFileName.textContent;
      const uploaded = document.querySelectorAll('#uploadedTable tbody tr').length;

      statusText.textContent = [
        'ComentFile="' + coment + '"',
        'fileValue="' + realFileInput.value + '"',
        'uploadedRows=' + uploaded,
      ].join(' | ');

      if (!coment) {
        document.getElementById('errorComent').style.display = 'inline';
        statusText.textContent = '❌ FALLA: ComentFile vacío';
        return;
      }
      if (uploaded === 0) {
        statusText.textContent = '❌ FALLA: No hay documentos subidos';
        return;
      }
      statusText.textContent = '✅ OK — avanzando a pantalla de contacto...';
      setTimeout(() => { alert('Continuar OK!'); }, 500);
    });
  </script>
</body>
</html>
